mqtt:
  url: mqtt://192.168.10.10:1883
  options:
    # full list of options at https://www.npmjs.com/package/mqtt#mqttclientstreambuilder-options
global:
  prefix: # prefix pre-pendend to all exported metrics, in addition to the pattern prefix if specified
patterns:
  - pattern: home/+device/json
    format: json # 'json' is the default, other option is 'val' for a scalar value
    labels:  # additional labels to associate the metric with
      location: home
  - pattern: auto/+device/json
    format: json
    labels:
      location: auto
  - pattern: tele/+device/SENSOR
    prefix: tm_ # default prefix is blank
    recursive: Yes # also parse entries that are json objects themselves
  - pattern: tele/+device/STATE
    prefix: tms_
    recursive: Yes
  - pattern: tele/+device/LWT
    prefix: tms_
    format: val
    value-default: 0 # 0 is default if unspecified
    value-map:
      Online: 1
      OFF: 0
      ON: 1
  - pattern: msh/+country/+channel/json/+area/+device
    prefix: mesh_
    recursive: true
    labels:
      location: home
    label-fields: [from, type]
  - pattern: rf/+device/+message/json
    format: json
    prefix: rf_
    labels:
      location: rf
  - pattern: ac/+room/json
    format: json
    prefix: ac_
    labels:
      location: ac
    recursive: Yes
    value-map:
      QUIET: 0
      AUTO: -1
      OFF: 0
      ON: 1
      SWING: -2
      HEAT: 1
      DRY: 2
      COOL: 3
      FAN: 4
      no: 0
      yes: 1
  - pattern: msh/US/2/json/+channel/+node
    format: json
    prefix: mesh_
    labels:
      location: home
    recursive: Yes
  - pattern: test/+device/json
    format: json
    prefix: test_
    labels:
      location: test
